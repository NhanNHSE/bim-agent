name: BIM AI Agent CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint (fast) ───────────────────────────────────────────
  # Only fatal errors for now (syntax errors, undefined names) — widen rule set later.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Ruff (fatal errors only)
        run: ruff check --select E9,F63,F7,F82 --output-format=github backend tests

  # ── Unit Tests (no Docker, full dependencies) ─────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: >
          python -m pytest -c pytest.ini --rootdir=. ../tests/unit
          -v --tb=short --junitxml=../test-results/unit.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/

  # ── Docker Build + tests inside the image ─────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Context must be the repo root: the Dockerfile copies backend/ and tests/unit/
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: bim-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: bim-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Same command as the documented `docker exec bim-backend pytest tests`
      - name: Run unit tests inside backend image
        run: docker run --rm -e DEBUG=true bim-backend:ci pytest tests -q --tb=short

  # ── Integration Tests (full Docker stack) ─────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          GEMINI_API_KEY=ci_dummy_key
          NEO4J_PASSWORD=ci_test_neo4j_2026
          POSTGRES_PASSWORD=ci_test_postgres_2026
          JWT_SECRET_KEY=ci_test_jwt_secret_key_at_least_32_characters_long
          DEBUG=true
          EOF

      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/v1/health > /dev/null 2>&1; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "Backend failed to start"
          docker compose logs backend
          exit 1

      - name: Run tests inside running stack
        run: docker exec bim-backend pytest tests -q --tb=short

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Teardown
        if: always()
        run: docker compose down -v

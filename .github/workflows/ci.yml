name: BIM AI Agent CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint (fast) ───────────────────────────────────────────
  # Rule set lives in backend/pyproject.toml ([tool.ruff.lint]).
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Ruff
        run: ruff check --config backend/pyproject.toml --output-format=github backend

      # Ruff misses compile-time errors such as "name used prior to global
      # declaration" (crawl_qcvn.py shipped with one); the compiler doesn't.
      - name: Compile all Python
        run: python -m compileall -q backend/src backend/scripts backend/tests

  # ── Secret scan (full history) ────────────────────────────
  secrets:
    name: Secret Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .

  # ── Unit Tests (no Docker, full dependencies) ─────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend
    env:
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip "setuptools>=83"
          pip install -r requirements.txt
          pip install -e . --no-deps  # makes `src` importable; also validates pyproject.toml
          # CI-only: PR annotations for failed tests, coverage, dependency audit
          pip install pytest-github-actions-annotate-failures==0.4.2 pytest-cov==7.1.0 pip-audit==2.10.1

      - name: Run unit tests
        run: >
          python -m pytest tests/unit
          -v --tb=short --junitxml=../test-results/unit.xml
          --cov=src --cov-report=term-missing:skip-covered --cov-report=xml:../test-results/coverage.xml

      # Coverage gate lives here (pytest --cov-fail-under printed FAIL but exited 0 with pytest 9 + pytest-cov 7).
      # Threshold and report options: [tool.coverage.report] in backend/pyproject.toml
      - name: Coverage summary
        if: always()
        run: |
          echo '## Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Blocking: any vulnerability not listed (with a reason) in backend/.pip-audit-ignore fails CI
      - name: Audit dependencies (pip-audit)
        run: |
          ignores=$(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' -e 's/^[[:space:]]*/--ignore-vuln /' .pip-audit-ignore)
          status=0
          pip-audit --progress-spinner off --desc on -f markdown -o ../test-results/pip-audit.md $ignores || status=$?
          cat ../test-results/pip-audit.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $status

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: test-results/

  # ── Docker Build + tests inside the image ─────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-24.04
    needs: unit-tests

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build context is backend/ (src, scripts, tests all live there)
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          tags: bim-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          tags: bim-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      # Unit tests against the built image (integration tests skip without the running stack)
      - name: Run unit tests inside backend image
        run: docker run --rm -e DEBUG=true bim-backend:ci pytest tests/unit -q --tb=short

  # ── Integration Tests (full Docker stack) ─────────────────
  # Runs on PRs too: when it ran on main only, a broken frontend healthcheck was found after merge.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-24.04
    needs: docker-build

    steps:
      - uses: actions/checkout@v7

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          GEMINI_API_KEY=ci_dummy_key
          NEO4J_PASSWORD=ci_test_neo4j_2026
          POSTGRES_PASSWORD=ci_test_postgres_2026
          JWT_SECRET_KEY=ci_test_jwt_secret_key_at_least_32_characters_long
          DEBUG=true
          EOF

      - name: Start services
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8001/api/v1/health > /dev/null 2>&1; then
              echo "Backend healthy"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "Backend failed to start"
          docker compose logs backend
          exit 1

      - name: Integration tests against the running stack
        run: docker exec -e BIM_INTEGRATION=1 bim-backend pytest tests/integration -v --tb=short

      - name: Collect logs on failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Teardown
        if: always()
        run: docker compose down -v
